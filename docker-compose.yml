services:
  backend:
    build: ./docker/backend
    working_dir: /app
    command: sh -c "python -m app.seed_nsqf && python -m app.seed_auth && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
  frontend:
    build: ./docker/frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
